[project]
name = "dailytalk"
version = "0.1.0"
description = "DailyTalk: Spoken Dialogue Dataset for Conversational Text-to-Speech"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "product_key_memory >= 0.2.0",
    "local_attention >= 1.9.0",
    "rotary_embedding_torch >= 0.6.0",
    "python_speech_features >= 0.6",
    "pandas >= 2.2.0",
    "h5py >= 3.11.0",
    "g2p_en >= 2.1.0",
    "inflect >= 7.0.0",
    "librosa >= 0.10.1",
    "matplotlib >= 3.9.0",
    "numba >= 0.61.0",
    "numpy >= 2.0.0",
    "pypinyin >= 0.50.0",
    "pyworld >= 0.3.4",
    "pyyaml >= 6.0.1",
    "scikit-learn >= 1.5.0",
    "scipy >= 1.13.0",
    "soundfile >= 0.12.1",
    "tensorboard >= 2.18.0",
    "tgt >= 1.4.4",
    "torch >= 2.6.0",
    "tqdm >= 4.66.0",
    "unidecode >= 1.3.8",
    "pillow >= 10.3.0",
    "einops >= 0.8.0",
    "sentence-transformers >= 3.0.0",
    "transformers >= 4.45.0",
]

[dependency-groups]
dev = [
    "pyrefly>=1.0.0",
]




