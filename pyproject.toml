[project]
name = "dailytalk"
version = "0.1.0"
description = "DailyTalk: Spoken Dialogue Dataset for Conversational Text-to-Speech"
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "av>=18.0.0",
  "einops>=0.8",
  "g2p-en>=2.1",
  "h5py>=3.11",
  "inflect>=7",
  "librosa>=0.10.1",
  "local-attention>=1.9"  ,
  "matplotlib>=3.9",
  "num2words>=0.5.14",
  "numba>=0.61",
  "numpy>=2",
  "pandas>=2.2",
  "pillow>=10.3",
  "product-key-memory>=0.2",
  "pydantic>=2.13.4",
  "pypinyin>=0.50",
  "python-speech-features>=0.6",
  "pyworld>=0.3.4",
  "pyyaml>=6.0.1",
  "rotary-embedding-torch>=0.6",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "sentence-transformers>=3",
  "soundfile>=0.12.1",
  "tensorboard>=2.18",
  "tgt>=1.4.4",
  "torch>=2.6",
  "tqdm>=4.66",
  "transformers>=4.45",
  "typer>=0.25.1",
  "unidecode>=1.3.8",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "ruff>=0.15.14",
  "ty>=0.0.43",
  "types-tqdm>=4.67.3.20260518",
]

[tool.ruff]
# Target Python version 3.14 to match project requires-python
target-version = "py314"
# Set standard line length
line-length = 100
# Files and directories to exclude
exclude = [ ".git", ".venv", "__pycache__", "build", "dist", "preprocessed_data" ]
format.indent-style = "space"
format.quote-style = "double"
format.line-ending = "auto"
format.skip-magic-trailing-comma = false
# Select rules:
# E/W: pycodestyle
# F: Pyflakes
# I: isort (automatic import sorting)
# UP: pyupgrade (modernize syntax)
# B: flake8-bugbear (common design bugs)
# C4: flake8-comprehensions
# SIM: flake8-simplify
# A: flake8-builtins
lint.select = [ "A", "B", "C4", "E", "F", "I", "SIM", "UP", "W" ]
# Rule exclusions
lint.ignore = [
  "E402", # Module level import not at top of file
  "E501", # Line too long (handled by formatter)
  "E731", # Do not assign a lambda expression, use a def
]

[tool.ty]
src.exclude = [ ".git", ".venv", "__pycache__", "build", "dist", "preprocessed_data" ]
src.respect-ignore-files = true
environment.python-platform = "linux"
# Target Python version 3.14 to match project requires-python
environment.python-version = "3.14"

[tool.pytest.ini_options]
pythonpath = ["src"]
