[project]
name = "dailytalk"
version = "0.1.0"
description = "DailyTalk: Spoken Dialogue Dataset for Conversational Text-to-Speech"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "product_key_memory >= 0.2.0",
    "local_attention >= 1.9.0",
    "rotary_embedding_torch >= 0.6.0",
    "python_speech_features >= 0.6",
    "pandas >= 2.2.0",
    "h5py >= 3.11.0",
    "g2p_en >= 2.1.0",
    "inflect >= 7.0.0",
    "librosa >= 0.10.1",
    "matplotlib >= 3.9.0",
    "numba >= 0.61.0",
    "numpy >= 2.0.0",
    "pypinyin >= 0.50.0",
    "pyworld >= 0.3.4",
    "pyyaml >= 6.0.1",
    "scikit-learn >= 1.5.0",
    "scipy >= 1.13.0",
    "soundfile >= 0.12.1",
    "tensorboard >= 2.18.0",
    "tgt >= 1.4.4",
    "torch >= 2.6.0",
    "tqdm>=4.66.0",
    "unidecode >= 1.3.8",
    "pillow >= 10.3.0",
    "einops >= 0.8.0",
    "sentence-transformers >= 3.0.0",
    "transformers >= 4.45.0",
]

[dependency-groups]
dev = [
    "pyrefly>=1.0.0",
    "ruff>=0.15.14",
    "types-tqdm>=4.67.3.20260518",
]

[tool.ruff]
# Target Python version 3.14 to match project requires-python
target-version = "py314"

# Set standard line length
line-length = 100

# Files and directories to exclude
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "preprocessed_data",
]

[tool.ruff.lint]
# Select rules:
# E/W: pycodestyle
# F: Pyflakes
# I: isort (automatic import sorting)
# UP: pyupgrade (modernize syntax)
# B: flake8-bugbear (common design bugs)
# C4: flake8-comprehensions
# SIM: flake8-simplify
# A: flake8-builtins
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "A",
]

# Rule exclusions
ignore = [
    "E501",  # Line too long (handled by formatter)
    "E731",  # Do not assign a lambda expression, use a def
    "E402",  # Module level import not at top of file
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"





